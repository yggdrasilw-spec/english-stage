name: Validate and publish English Stage
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check learning logic
        run: npm test
      - name: Check question intonation pipeline and player
        run: |
          python -m unittest discover -s dist/tts -p test_build_clips.py
          node --test dist/tts/test_player.cjs
      - name: Check grammar learning and AI handoff
        run: npm run grammar:test
      - name: Check grammar release files
        run: npm run grammar:check
      - name: Check versioned release entry
        run: npm run validate:entry
      - name: Validate content and all audio files
        run: npm run validate
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
        with:
          timeout: 1200000
