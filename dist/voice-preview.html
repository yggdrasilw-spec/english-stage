<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>米国英語音声の試聴 | English Stage</title><link rel="stylesheet" href="styles.css"></head><body><main class="narrow"><a href="index.html">← アプリへ</a><div class="eyebrow">VOICE CHECK</div><h1>Neural2の音声を確かめる</h1><p>単語と例文を、ふつう・ゆっくりの2速度で聞き比べられます。音声はGoogle Cloud Text-to-Speechで事前生成した合成音声です。</p><p id="status" role="status">音声を準備中です。</p><div id="samples"></div></main><script type="module">
const status=document.querySelector('#status'),samples=document.querySelector('#samples');
try{const r=await fetch('data/audio-sample.json');if(!r.ok)throw Error('試聴音声はまだ作成されていません。');const m=await r.json();status.textContent=m.voice+' · '+m.languageCode;for(const f of m.files){if(!/^assets\/audio\/[a-z0-9-]+\.mp3$/.test(f.path))continue;const section=document.createElement('section');section.className='panel';const h=document.createElement('h2');h.lang='en-US';h.textContent=f.text;const p=document.createElement('p');p.textContent=(f.part==='word'?'単語':'例文')+' · '+(f.speed==='slow'?'ゆっくり':'ふつう');const a=document.createElement('audio');a.controls=true;a.preload='none';a.src=f.path;a.style.width='100%';a.addEventListener('play',()=>document.querySelectorAll('audio').forEach(other=>{if(other!==a)other.pause();}));section.append(h,p,a);samples.append(section);}}catch(e){status.textContent=e.message;}
</script></body></html>
