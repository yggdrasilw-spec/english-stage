<style>
:root{--bg:#fff3d6;--ink:#1f2a44;--chip:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171b2e;--ink:#f4f1ff;--chip:#2a3050}}
:root[data-theme="dark"]{--bg:#171b2e;--ink:#f4f1ff;--chip:#2a3050}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Fredoka","Hiragino Maru Gothic ProN","Arial Rounded MT Bold",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden;user-select:none;-webkit-tap-highlight-color:transparent}
header{display:flex;align-items:center;gap:8px;padding:10px 12px 6px}
h1{flex:1;margin:0;font-size:22px;letter-spacing:.5px}
h1 b{color:#ff5d73}
button{font:inherit;font-weight:700;font-size:13px;color:var(--ink);background:var(--chip);border:2.5px solid var(--ink);border-radius:999px;padding:5px 12px;box-shadow:0 3px 0 var(--ink);cursor:pointer}
button:active{transform:translateY(3px);box-shadow:none}
button[aria-pressed=true]{background:#ffd23f;color:#1f2a44}
button:focus-visible{outline:3px solid #7c6cf0;outline-offset:2px}
svg{flex:1;min-height:0;width:100%;display:block}
.tile,#card{cursor:pointer}
.st{fill:#3a4570;transform-box:fill-box;transform-origin:center;transition:transform .5s cubic-bezier(.3,2,.5,1),fill .2s}
.st.on{fill:#ffd23f;transform:scale(1.25)}
.g,.d,.eye,.l{transform-box:fill-box;transform-origin:center}
.g{animation:spin 9s linear infinite}
.d{animation:drift 6s ease-in-out infinite}
.eye{animation:eb 4s infinite}
.l{animation:blink 1.2s infinite}
.belt{animation:belt 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{50%{transform:translateY(-14px) rotate(20deg)}}
@keyframes eb{94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes blink{50%{opacity:.25}}
@keyframes belt{to{transform:translateX(24px)}}
@media (prefers-reduced-motion:reduce){.g,.d,.belt,.eye,.l{animation:none}}

header{flex-wrap:wrap}header a{font-size:12px;color:inherit}header button{min-height:44px;padding:5px 9px}h1{font-size:19px}#status{min-height:38px;text-align:center;font:700 13px system-ui;padding:3px 8px}body>svg{flex:1;min-height:0}dialog{border:3px solid #1f2a44;border-radius:20px;background:#fff3d6;color:#1f2a44;width:min(480px,88vw);max-height:82dvh;overflow:auto;font:15px system-ui}dialog::backdrop{background:#182139aa}dialog h2{margin-top:0}dialog label{display:block;padding:6px}dialog select{font:inherit;min-height:44px;max-width:100%}#genres{display:grid;grid-template-columns:1fr 1fr}#genres label{display:flex;align-items:center;min-height:44px;font-size:13px}input[type=checkbox]{width:22px;height:22px}fieldset{border:1px solid #888;border-radius:10px}button:disabled{opacity:.5}#card:focus-visible,.tile:focus-visible{outline:3px solid #7c6cf0}#cl{font-size:12px}#settings button{margin:5px}#settings p{line-height:1.6}
</style>
</head>
