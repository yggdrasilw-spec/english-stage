  W=deck[wi++];wordMiss=false;demoUsed=auto;currentStep=0;input=ABCHand.createSpellingInput(W.w);inputReady=false;
  showWordImage();warmNextImages();

  const al='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').filter(c=>!W.w.includes(c)).sort(()=>Math.random()-.5);
  const pool=[...W.w,...al.slice(0,Number(settings.distractors))].sort(()=>Math.random()-.5);
  tiles=pool.map((ch,i)=>{const x=36.5+(i%8)*41,y=440+Math.floor(i/8)*42,T={ch,x,y,sx:0,sy:0,r:0,home:{x,y},used:false,el:mk(ch)};T.el.setAttribute('role','button');T.el.setAttribute('tabindex','0');T.el.setAttribute('aria-label',ch);T.el.onclick=()=>acceptTile(T);T.el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();T.el.onclick();}};return T});
  const n=W.w.length;
  S=[...W.w].map((ch,i)=>{const g=document.createElementNS(NS,'g');g.setAttribute('transform','scale(0)');g.innerHTML=`<rect x="-19" y="-19" width="38" height="38" rx="11" fill="#fff" fill-opacity=".6" stroke="${INK}" stroke-width="2.5" stroke-dasharray="5 5"/><text y="9" text-anchor="middle" font-size="26" font-weight="700" fill="${INK}" opacity="${settings.hints==='always'?.3:0}">${ch}</text>`;sl.append(g);const columns=Math.min(n,8),row=Math.floor(i/8),count=Math.min(8,n-row*8);return{x:180+((i%8)-(count-1)/2)*40,y:310+row*42,g,s:0,T:null}});
  C.s=0;sfx(300,.25,'sine',.05,2.2);
  await Promise.all([to(C,'s',1,520,E.ob),...S.map((q,i)=>sleep(i*70).then(()=>to(q,'s',1,380,E.ob))),...tiles.map((T,i)=>sleep(150+i*60).then(()=>{sfx(500+i*60,.07);return tw(380,p=>T.sx=T.sy=p,E.ob)}))]);
  inputReady=true;updateStatus();
}
async function scan(T){
  await Promise.all([to(H,'x',T.home.x,dur(T.home.x-H.x,220,.9)),to(H,'jaw',.7,260,E.o)]);
  H.av-=140;sfx(400,.06,'square',.03);
  await tw(380,p=>{const s=Math.sin(p*Math.PI);T.y=T.home.y-10*s;T.sy=1+.1*s;T.sx=1-.05*s},E.l);T.y=T.home.y;T.sx=T.sy=1;await sleep(120)}
async function nope(T){
  await Promise.all([to(H,'x',T.home.x,dur(T.home.x-H.x,220,.9)),to(H,'jaw',.7,200,E.o)]);
  sfx(180,.25,'sawtooth',.05,.6);H.av+=160;
  await tw(420,p=>{T.r=Math.sin(p*Math.PI*6)*12*(1-p)},E.l);T.r=0}
function previewTile(T,index){
 T.el.classList.add('queued');T.el.setAttribute('aria-disabled','true');
 const text=S[index].g.querySelector('text');text.setAttribute('opacity','.8');text.setAttribute('fill','#157c6d');
}
function acceptTile(T){
 if(paused||auto||!inputReady)return;
 const result=input.accept(T);if(result.kind==='ignored')return;
 if(result.kind==='wrong'){
  wordMiss=true;combo=0;errors++;
  if(settings.hints==='mistake')S[result.index].g.querySelector('text').setAttribute('opacity','.5');
  T.el.classList.add('bad');setTimeout(()=>T.el.classList.remove('bad'),240);sfx(180,.12,'triangle',.04,.6);
  updateStatus('ちがう文字だよ。もう一度！');return;
 }
 previewTile(T,result.index);sfx(640+result.index*40,.045,'sine',.035);updateStatus();
 const wake=waiter;waiter=null;wake?.(null);
}
async function choose(i){
 currentStep=i;
 for(;;){
  if(paused)await new Promise(r=>resumeWait=r);
  const queued=input.take();if(queued)return queued;
  if(auto){demoUsed=true;
   if(i===0||Math.random()<.4){const d=tiles.filter(t=>!t.used&&!t.reserved&&t.ch!==W.w[i]);if(d.length)await scan(d[Math.random()*d.length|0]);}
   if(!auto)continue;
   const T=tiles.find(t=>!t.used&&!t.reserved&&t.ch===W.w[i]);
   const result=input.accept(T);if(result.kind==='correct'){previewTile(T,result.index);return input.take();}
   continue;
  }
  await new Promise(r=>waiter=r);waiter=null;
 }
}
async function place(T,i){
  transporting=true;T.used=true;const q=S[i];updateStatus();
  await Promise.all([to(H,'x',T.home.x,dur(T.home.x-H.x,260,1.1)),to(H,'jaw',1,260,E.o)]);
  await to(H,'len',T.home.y-72,dur(T.home.y-72-H.len,170,.8));
  await to(H,'jaw',0,150,E.o);
  held=T;ring(T.x,T.y);burst(T.x,T.y,7,90);sfx(660,.09,'square',.04,1.5);
  tw(300,p=>{const k=Math.sin(p*Math.PI)*.2;T.sx=1+k;T.sy=1-k},E.l);
  await sleep(80);
  const up=to(H,'len',44,dur(367,170,.8));await sleep(190);
  await Promise.all([up,to(H,'x',q.x,dur(q.x-H.x,260,1.1))]);
  await to(H,'len',q.y-72,dur(q.y-72-H.len,140,.8));
  await to(H,'jaw',1,140,E.o);
  held=null;q.T=T;T.el.classList.remove('queued');q.g.querySelector('text').setAttribute('opacity','0');
  const x0=T.x,y0=T.y,r0=T.r;sfx(330,.14,'sine',.08,.5);
  setTimeout(()=>{ring(q.x,q.y);burst(q.x,q.y,9,130);sfx(740,.1,'triangle',.07,1.3);tw(280,p=>{const k=Math.sin(p*Math.PI)*.24;T.sx=1+k;T.sy=1-k},E.l)},125/playbackRate());
  await Promise.all([tw(380,p=>{T.x=x0+(q.x-x0)*p;T.y=y0+(q.y-y0)*p;T.r=r0*(1-p)},E.bo),to(H,'jaw',.45,300,E.o),to(H,'len',44,520,E.io)]);
  transporting=false;updateStatus();
}
async function cheer(){
  const imageHint=abcHandImageHints[W.id]===true;
  const result={en:D[W.id][0],ja:D[W.id][2],quality:demoUsed||wordMiss||settings.hints==='always'||imageHint?'guess':'correct'};results.push(result);
  if(!demoUsed)window.recordWordEvidence({...result,skill:'spell',source:'abc-hand',assisted:wordMiss||settings.hints==='always'||imageHint});

  let gain=0;if(!demoUsed){combo++;best=Math.max(best,combo);gain=hunterPoints(hunterBase(deckPoolSize),combo,settings.hints!=='none');score+=gain;}else combo=0;updateStatus(demoUsed?'おまかせの見本：0点':`できた！ ${D[W.id][0]} +${gain}点`);const sp=say(W.w);
  [523,659,784,1047].forEach((f,i)=>setTimeout(()=>sfx(f,.18,'triangle',.08),i*110));
  burst(180,205,26,260);burst(180,SY,18,200);
  const k=(wi-1)%5;if(!k)document.querySelectorAll('.st').forEach(s=>s.classList.remove('on'));$('#s'+k).classList.add('on');
  S.forEach((q,i)=>sleep(i*110).then(()=>tw(460,p=>{const s=Math.sin(p*Math.PI),b=Math.sin(p*Math.PI*2)*.12;q.T.y=q.y-28*s;q.T.sy=1+b;q.T.sx=1-b},E.l)));
  tw(650,p=>{C.s=1+.18*Math.sin(p*Math.PI);C.r=Math.sin(p*Math.PI*4)*6*(1-p)},E.l);
  H.av+=200;
  await Promise.all([to(H,'x',180,500),to(H,'len',44,350),(async()=>{for(let j=0;j<2;j++){await to(H,'jaw',1,140,E.o);await to(H,'jaw',.1,140,E.o)}await to(H,'jaw',.45,200)})()]);
  await Promise.all([sleep(700),sp]);
}
async function outro(){
  inputReady=false;
  sfx(500,.25,'sine',.05,.4);
  await Promise.all([...tiles.map((T,i)=>sleep(i*45).then(()=>tw(260,p=>T.sx=T.sy=1-p))),...S.map((q,i)=>sleep(i*45).then(()=>to(q,'s',0,240))),to(C,'s',0,300)]);
  tiles.forEach(T=>T.el.remove());S.forEach(q=>q.g.remove());tiles=[];S=[];
}
$('#am').onclick=e=>{auto=!auto;if(W)demoUsed=true;e.currentTarget.setAttribute('aria-pressed',auto);waiter&&waiter(null)};
$('#sn').onclick=e=>{snd=!snd;settings.sound=snd;try{localStorage.setItem('abc-hand-v1',JSON.stringify(settings));}catch{}e.currentTarget.setAttribute('aria-pressed',snd);e.currentTarget.textContent=(snd?'🔊':'🔇')+' おと';if(snd){ac=ac||new AudioContext();ac.resume();sfx(880,.1)}};
card.onclick=()=>W&&say(W.w);card.setAttribute('role','button');card.setAttribute('tabindex','0');card.setAttribute('aria-label','単語の音声を聞く');card.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();card.onclick();}};

/* Session settings are separate from hunter progress. */
let settings={genres:[0,1,2,3,4],distractors:4,hints:'mistake',rounds:10,sound:true};
try{const saved=JSON.parse(localStorage.getItem('abc-hand-v1'));if(saved){if(typeof saved.sound==='boolean')snd=settings.sound=saved.sound;settings.genres=Array.isArray(saved.genres)?saved.genres.filter(g=>Number.isInteger(g)&&GN[g]):settings.genres;if([0,2,4,8].includes(+saved.distractors))settings.distractors=+saved.distractors;if(['always','mistake','none'].includes(saved.hints))settings.hints=saved.hints;if([0,5,10,20].includes(+saved.rounds))settings.rounds=+saved.rounds;}}catch{}
$('#sn').setAttribute('aria-pressed',String(snd));$('#sn').textContent=(snd?'🔊':'🔇')+' おと';
let results=[];
let deck=[],deckPoolSize=0,combo=0,best=0,score=0,errors=0,wordMiss=false,demoUsed=false,currentStep=0,paused=true,resumeWait=null,started=false,sessionDone=false;
const status=t=>$('#status').textContent=t;
const imageLoader=ABCHand.createImageLoader();let imageVersion=0,imageState='none';
const wordImageURL=id=>abcHandImages[id]||null;
function imageMessage(lines){
 $('#ci').replaceChildren();for(const [i,line] of lines.entries()){const text=document.createElementNS(NS,'text');text.setAttribute('x','50');text.setAttribute('y',42+i*20);text.setAttribute('text-anchor','middle');text.setAttribute('fill','#596579');text.setAttribute('font-size','12');text.textContent=line;$('#ci').append(text);}
}
function showWordImage(force=false,renderAttempt=0){
 const token=++imageVersion,url=wordImageURL(W.id);$('#image-retry').hidden=true;
 if(!url){imageState='none';imageMessage(['この単語は','日本語でこたえよう']);return;}
 imageState='loading';imageMessage(['画像を','読み込み中…']);
 imageLoader.load(url,{force}).then(src=>{
  if(token!==imageVersion)return;
  const img=document.createElementNS(NS,'image');img.setAttribute('width',100);img.setAttribute('height',100);img.setAttribute('preserveAspectRatio','xMidYMid meet');
  const failed=()=>{if(token!==imageVersion)return;if(renderAttempt<1){imageLoader.forget(url);showWordImage(true,renderAttempt+1);return;}imageState='error';imageLoader.forget(url);imageMessage(['画像を読み込めません','再読込できます']);$('#image-retry').hidden=false;};
  img.onerror=failed;img.onload=()=>{if(token===imageVersion){imageState='ready';$('#ci').querySelectorAll('text').forEach(e=>e.remove());}};
  img.setAttribute('href',src);$('#ci').append(img);
 }).catch(()=>{if(token!==imageVersion)return;imageState='error';imageMessage(['画像を読み込めません','再読込できます']);$('#image-retry').hidden=false;});
}
function warmNextImages(){imageLoader.preload(deck.slice(wi,wi+3).map(w=>wordImageURL(w.id)));}
$('#image-retry').onclick=()=>{if(W)showWordImage(true);};
function updateStatus(extra=''){const progress=inputReady&&!auto?(input.accepted===W.w.length?'入力できた！ お届け中':`入力 ${input.accepted}/${W.w.length} · 続けてタップOK`):'';status(`${wi}/${deck.length}語 · ⭐ ${score.toLocaleString()} · コンボ ${combo}${extra||progress?' ｜ '+(extra||progress):''}`);}
const wordAudio=new Audio();wordAudio.preload='none';
function say(){return new Promise(resolve=>{if(!snd||!W)return resolve();wordAudio.pause();wordAudio.src='assets/audio/'+audioFiles[W.id]+'.mp3';let timer;const end=()=>{clearTimeout(timer);wordAudio.onended=wordAudio.onerror=null;resolve();};wordAudio.onended=end;wordAudio.onerror=()=>{status('音声を読み込めません。音ボタンでもう一度ためしてね');end();};timer=setTimeout(end,8000);wordAudio.play().catch(()=>{status('音声を再生できません。音ボタンでもう一度ためしてね');end();});});}
function eligible(){return D.map((d,id)=>({id,w:d[0].replace(/ \(.*?\)/g,'').replace(/[^a-z]/gi,'').toUpperCase(),jp:d[2]})).filter(w=>settings.genres.includes(GI[w.id])&&w.w.length>0&&Number.isFinite(window.sharedWordPriority(D[w.id][0],D[w.id][2],'spell')));}
function readOptions(){settings.genres=[...document.querySelectorAll('#genres input:checked')].map(e=>+e.value);for(const k of ['distractors','hints','rounds'])settings[k]=$('#'+k).value;const n=eligible().length;$('#pool-count').textContent=`${settings.genres.length}ジャンル・${n}語。空白・記号は省いて文字をならべます。`;$('button[type=submit]').disabled=!n;}
$('#genres').innerHTML=GN.map(([name,emoji],g)=>`<label><input type="checkbox" value="${g}" ${settings.genres.includes(g)?'checked':''}>${emoji} ${name}</label>`).join('');
for(const k of ['distractors','hints','rounds'])$('#'+k).value=settings[k];
$('#options').onchange=readOptions;
$('#all-genres').onclick=()=>{document.querySelectorAll('#genres input').forEach(e=>e.checked=true);readOptions();};
function openSettings(){paused=true;for(const el of document.querySelectorAll('#options input,#options select,#all-genres'))el.disabled=started&&!sessionDone;$('#options button[type=submit]').disabled=started&&!sessionDone;$('#pool-count').textContent=started&&!sessionDone?'プレイ中は設定を固定しています。「つづける」で再開できます。':`${settings.genres.length}ジャンル・${eligible().length}語`;$('#settings').showModal();$('#close-settings').disabled=!started||sessionDone;}
$('#settings-open').onclick=openSettings;
function resume(){paused=false;$('#settings').close();resumeWait?.();resumeWait=null;}
$('#close-settings').onclick=resume;
$('#settings').oncancel=e=>{e.preventDefault();if(started&&!sessionDone)resume();};
$('#options').onsubmit=async e=>{e.preventDefault();await window.wordLearningReady;if(started&&!sessionDone)return;readOptions();const p=eligible();deckPoolSize=p.length;deck=p.sort(()=>Math.random()-.5).sort((a,b)=>window.sharedWordPriority(D[a.id][0],D[a.id][2],'spell')-window.sharedWordPriority(D[b.id][0],D[b.id][2],'spell')).slice(0,+settings.rounds||p.length);try{localStorage.setItem('abc-hand-v1',JSON.stringify(settings));}catch{}wi=score=combo=best=errors=0;results=[];sessionDone=false;started=true;imageLoader.preload(deck.slice(0,4).map(w=>wordImageURL(w.id)));resume();main();};
async function main(){
 $('#options button[type=submit]').disabled=true;
 for(;wi<deck.length;){if(paused)await new Promise(r=>resumeWait=r);await intro();for(let i=0;i<W.w.length;i++){const T=await choose(i);await place(T,i)}await cheer();await outro();}
 sessionDone=true;started=false;showReview();for(const el of document.querySelectorAll('#options input,#options select,#all-genres'))el.disabled=false;status(`クリア！ ⭐ ${score.toLocaleString()}点 · ${deck.length}語 · ミス ${errors}回 · 最高コンボ ${best} ｜ 設定からもう一度`);$('#options button[type=submit]').disabled=false;
}
function showReview(){
 const dialog=$('#round-review');$('#review-title').textContent='クリア！ '+deck.length+'語に挑戦したね';
 $('#review-score').textContent='⭐ '+score.toLocaleString()+'点 · ミス '+errors+'回 · 最高コンボ '+best;
 const list=$('#review-words');list.replaceChildren();
 for(const r of results){const li=document.createElement('li');li.textContent=(r.quality==='correct'?'✓ 自分でできた！ ':'🌱 もう一度で強くなる ')+r.en+' ＝ '+r.ja;list.append(li);}
 dialog.showModal();$('#review-retry').disabled=!results.some(r=>r.quality!=='correct');
}
$('#review-again').onclick=()=>{$('#round-review').close();openSettings();};
$('#review-retry').onclick=()=>{const weak=new Set(results.filter(r=>r.quality!=='correct').map(r=>r.en));deck=deck.filter(w=>weak.has(D[w.id][0]));wi=score=combo=best=errors=0;results=[];sessionDone=false;started=true;$('#round-review').close();paused=false;main();};
$('#am').setAttribute('aria-pressed','false');
readOptions();openSettings();
</script></body></html>
