<style>
:root{--bg:#12504b;--card:#fff9e6;--ink:#1d2b2a;--sun:#ffd23f;--berry:#ff5d73;--sky:#4cc9f0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;margin:0}
body{background:var(--bg);color:#fff;font-family:"Hiragino Maru Gothic ProN","BIZ UDPGothic",system-ui,sans-serif;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px calc(env(safe-area-inset-bottom,0px) + 10px);touch-action:manipulation}
.scr{display:none;height:100%;flex-direction:column;max-width:520px;margin:0 auto}
.scr.on{display:flex}
#game{max-width:860px}
h1{font-size:30px;margin:8px 0;text-align:center}
.mid{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;text-align:center;font-size:18px}
.btn{border:0;border-radius:18px;padding:16px;font:inherit;font-size:22px;font-weight:700;color:var(--ink);background:var(--sun);box-shadow:0 5px 0 #b8901a;min-height:58px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #b8901a}
.btn.sub{background:var(--sky);box-shadow:0 5px 0 #2a8fb0}
.bar{height:16px;background:#0005;border-radius:9px;overflow:hidden}
.bar b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--sky),var(--sun));transition:width .3s}
.top{display:flex;align-items:center;gap:8px;font-weight:700;min-height:48px}
.top .bar{flex:1}
#sc{min-width:78px;text-align:right;font-size:22px;color:#fff;font-variant-numeric:tabular-nums;white-space:nowrap}
#sc.pop{animation:pop .25s}
#cb{min-width:62px;text-align:right;font-size:22px;color:var(--sun);white-space:nowrap}
#cb.pop{animation:pop .25s}
#hb{border:0;border-radius:14px;padding:5px 9px;font:inherit;font-size:13px;font-weight:700;line-height:1.2;color:var(--ink);background:var(--sun);box-shadow:0 3px 0 #b8901a;min-height:44px}
#hb.off{background:#0006;color:#fff;box-shadow:0 3px 0 #0007}
@keyframes pop{50%{transform:scale(1.4)}}
#msg{height:34px;line-height:34px;text-align:center;font-size:22px;font-weight:700;color:var(--sun)}
/* 空中を飛び回るカードのエリア */
#A{position:relative;flex:1;min-height:0;margin-top:6px;overflow:hidden;border-radius:20px;background:#ffffff12;touch-action:none}
.fc{position:absolute;left:0;top:0;will-change:transform}
.fc.sel{z-index:3}
.cd{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:104px;height:78px;padding:0 14px;white-space:nowrap;line-height:1.1;border:4px solid transparent;background:var(--card);border-radius:16px;font:inherit;font-size:22px;font-weight:700;color:var(--ink);box-shadow:0 4px 0 #0005;transition:transform .15s,filter .5s}
.cd.pic{background:#e3f6ff}
.cd.dim{filter:brightness(.7) saturate(.8)}
.cd span{font-size:34px;line-height:1.1}
.cd small{font-size:16px;font-weight:700}
.cd.on{border-color:var(--sun);transform:scale(1.08);background:#fff3b0}
.cd.ok{background:var(--sky);transform:scale(1.1);opacity:0;transition:all .25s}
.cd.bad{background:#ffd6dc;border-color:var(--berry);animation:sh .3s}
.cd.new{animation:in .4s ease-out}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes in{from{opacity:0;transform:scale(.5)}}
/* ---- コンボ演出(レベル0〜4：コンボが続くほど はなやかに) ---- */
.pu{position:fixed;z-index:12;pointer-events:none;font-weight:900;white-space:nowrap;transform:translate(-50%,-50%);text-shadow:0 2px 0 #0007,0 0 10px #0005;animation:pu 1s ease-out forwards}
@keyframes pu{0%{opacity:0;transform:translate(-50%,-30%) scale(.5)}15%{opacity:1;transform:translate(-50%,-60%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-190%) scale(1)}}
.pu.t4{background:linear-gradient(90deg,#ff5d73,#ffd23f,#4cc9f0,#c77dff,#ff5d73);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent!important;text-shadow:none;filter:drop-shadow(0 2px 0 #0008);animation:pu 1s ease-out forwards,rbw .6s linear infinite}
@keyframes rbw{to{background-position:200% 0}}
.ring{position:fixed;z-index:11;pointer-events:none;border-radius:50%;border:5px solid var(--sun);transform:translate(-50%,-50%);animation:ring .6s ease-out forwards}
@keyframes ring{from{width:20px;height:20px;opacity:.9}to{width:var(--rs);height:var(--rs);opacity:0;border-width:1px}}
#fx{position:fixed;left:0;right:0;top:34%;z-index:15;text-align:center;pointer-events:none;font-weight:900}
#fx b{display:inline-block;color:#fff;text-shadow:0 4px 0 #0008,0 0 24px var(--c);animation:bn 1.1s ease-out forwards}
@keyframes bn{0%{opacity:0;transform:scale(.3) rotate(-6deg)}18%{opacity:1;transform:scale(1.25) rotate(3deg)}35%{transform:scale(1) rotate(0)}80%{opacity:1}100%{opacity:0;transform:scale(1.1) translateY(-20px)}}
#fl{position:fixed;inset:0;z-index:14;pointer-events:none;background:#fff;opacity:0}
#fl.go{animation:fl .35s ease-out}
@keyframes fl{from{opacity:.55}to{opacity:0}}
#A{transition:box-shadow .4s}
#A[data-t="2"]{box-shadow:inset 0 0 28px #ffd23f88}
#A[data-t="3"]{box-shadow:inset 0 0 40px #ff5d73aa}
#A[data-t="4"]{animation:rbo 1.2s linear infinite}
@keyframes rbo{0%,100%{box-shadow:inset 0 0 46px #ff5d73cc}25%{box-shadow:inset 0 0 46px #ffd23fcc}50%{box-shadow:inset 0 0 46px #4cc9f0cc}75%{box-shadow:inset 0 0 46px #c77dffcc}}
#A.shk{animation:shk .28s}
#A.shk4{animation:shk4 .34s}
@keyframes shk{25%{transform:translate(-3px,2px)}50%{transform:translate(3px,-2px)}75%{transform:translate(-2px,-1px)}}
@keyframes shk4{20%{transform:translate(-6px,3px)}40%{transform:translate(6px,-4px)}60%{transform:translate(-5px,-2px)}80%{transform:translate(4px,3px)}}
.stars{font-size:52px;letter-spacing:6px;color:var(--sun)}
.zg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;overflow:auto;flex:1;align-content:start;margin:10px 0}
.z{background:#0004;border-radius:10px;padding:6px 0;text-align:center;font-size:11px;font-weight:700;border:3px solid transparent}
.z span{display:block;font-size:26px}
.z.l1{background:var(--card);border-color:var(--sky);color:var(--ink)}
.z.l2{background:#fff3b0;border-color:var(--sun);color:var(--ink)}
.pt{position:fixed;pointer-events:none;z-index:9;font-size:20px;animation:pt .7s ease-out forwards}
@keyframes pt{to{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}
#tm{min-width:40px;text-align:right;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<style id="ui2">

.top{gap:10px}

.stars{font-size:60px;letter-spacing:8px}
.stars b{display:inline-block;color:#ffffff30;font-weight:400}
.stars b.on{color:var(--sun);text-shadow:0 0 22px #ffd23f99;animation:spn .55s cubic-bezier(.2,1.7,.4,1) both;animation-delay:calc(var(--k)*.28s + .15s)}
@keyframes spn{from{transform:scale(0) rotate(-45deg);opacity:0}}
.z{position:relative;border:2px dashed #ffffff2e;background:#ffffff0f;color:#ffffffb3;border-radius:14px}

.z.l2{background:#fff3b0;border:2px solid var(--sun);color:var(--ink);box-shadow:0 0 14px #ffd23f55}
.z.l2::after{content:"★";position:absolute;right:4px;top:0;font-size:12px;color:#e0a100}

.gl{display:grid;grid-template-columns:1fr 1fr;gap:8px;overflow:auto;flex:1;align-content:start;margin:10px 0}
.gc{display:flex;align-items:center;gap:8px;min-height:64px;padding:8px 10px;border-radius:16px;border:2px dashed #ffffff3d;background:#ffffff14;font-size:15px;font-weight:800;line-height:1.25}
.gc.on{background:var(--card);color:var(--ink);border:2px solid var(--sun);box-shadow:0 0 14px #ffd23f55}
.gc input{flex:none;width:24px;height:24px;accent-color:#e0a100}
.gc i{flex:none;font-style:normal;font-size:26px}
.gc em{display:block;font-style:normal;font-size:11px;font-weight:700;opacity:.7}
#gn .btn{margin-top:8px}
#gt{text-align:center;font-weight:800;color:var(--sun);min-height:24px}
.zh{grid-column:1/-1;margin-top:8px;font-size:15px;font-weight:900;color:var(--sun)}
.cd small.jp{font-size:22px}

/* 追加語のイラストは元の絵文字と同じ位置・寸法に収める */
.word-image{width:36px;height:36px;object-fit:contain;vertical-align:middle}
.z .word-image{width:26px;height:26px}
.cd.extra{min-width:108px;max-width:min(165px,48vw);white-space:normal;text-align:center;overflow-wrap:anywhere}

.cd.extra small{font-size:14px}
.cd.extra small.jp{font-size:16px}
.z.extra{overflow-wrap:anywhere;min-width:0}

 if(n=="tap")bell(880,.07,.1);
 else if(n=="ok"){bell(f,.4,.15);bell(f*1.5,.4,.13,.07)}
 else if(n=="sp")bell(f,.25,.1);

 else if(n=="ng")wob()}

function home(){run=false;lapUi();const P=pool(),m=P.filter(i=>lv(i)==2).length;$("hp").style.width=m/P.length*100+"%";$("ht").textContent=`マスター ${m} / ${P.length}ご（${S.g.length}ジャンル）`;$("hs").innerHTML=(S.streak?`🔥 ${S.streak}日れんぞく！`:"")+(S.hi?`<br>ベスト ⭐ ${S.hi.toLocaleString()}`:"")+(S.hiT?`<br>⏱ベスト ⭐ ${S.hiT.toLocaleString()}`:"");show("home")}
function zukan(){$("zg").innerHTML=GN.map(([n,e],g)=>{const x=gix(g);
 return`<div class="zh">${e} ${n}　${x.filter(i=>lv(i)==2).length} / ${x.length}</div>`+x.map(i=>{const d=D[i],v=lv(i);
  return`<div class="z l${v}${i>=originalWordCount?" extra":""}" ${v?`onclick="say(${i})"`:""}><span>${v?(d[3]?wordImage(d):d[1])||`<b style="font-size:13px">${d[2]}</b>`:"❓"}</span>${v?d[0]:"???"}</div>`}).join("")}).join("");show("zk")}
/* ---- ジャンルえらび：チェックしたジャンルのたんごだけが出る ---- */
/* じかんせい：1しゅうの語数。ぜんぶ＝チェックした全ジャンルの語。基本点は この語数で きまる(多いほど高い) */
function lapUi(){$("lb").textContent=`⏱ 1しゅうの ご数：${S.n||"ぜんぶ("+pool().length+")"}`}
function lapSel(){const o=[10,20,30,50,0];S.n=o[(o.indexOf(S.n)+1)%o.length];save();lapUi()}
function gt(){$("gt").textContent=`いま ${S.g.length}ジャンル ／ ${pool().length}ご から でるよ`}
function genres(){
 $("gl").innerHTML=GN.map(([n,e],g)=>{const x=gix(g),on=S.g.includes(g);
  return`<label class="gc${on?" on":""}"><input type="checkbox"${on?" checked":""} onchange="pick(${g},this)"><i>${e}</i><span>${n}<em>${x.filter(i=>lv(i)==2).length} / ${x.length}ご</em></span></label>`}).join("");
 gt();show("gn")}
function pick(g,el){
 const s=new Set(S.g);el.checked?s.add(g):s.delete(g);
 if(!s.size){el.checked=true;return}   /* さいごの1ジャンルは はずせない */
 S.g=[...s].sort((a,b)=>a-b);el.parentNode.classList.toggle("on",el.checked);save();gt()}
function gAll(){S.g=GN.map((_,g)=>g);save();genres()}

/* ---- 空中をただようカード ---- */
function measure(){const a=$("A");AW=a.clientWidth;AH=a.clientHeight}
addEventListener("resize",measure);
function rv(c){const a=Math.random()*6.283,sp=(V0+Math.random()*(V1-V0))*SP;c.tx=Math.cos(a)*sp;c.ty=Math.sin(a)*sp;c.tt=1.5+Math.random()*2.5}
/* 出現位置：ランダム。ほかのカードからなるべく遠い場所をえらぶ */
function place(c){
 const mx=Math.max(0,AW-c.w),my=Math.max(0,AH-c.h);let bx=0,by=0,bd=-1;
 for(let k=0;k<40;k++){
  const x=Math.random()*mx,y=Math.random()*my;let d=1e9;
  for(const o of C)d=Math.min(d,Math.hypot(x+c.w/2-(o.x+o.w/2),y+c.h/2-(o.y+o.h/2)));
  if(d>bd){bd=d;bx=x;by=y}
  if(d>c.w*1.3)break}
 c.x=bx;c.y=by}
function spawn(s,i,anim){
 const w=document.createElement("div"),b=document.createElement("button");
 w.className="fc";b.className="cd "+(s=="L"?"en":"pic")+(anim?" new":"")+(i>=originalWordCount?" extra":"");
 b.dataset.s=s;b.dataset.i=i;
 b.innerHTML=s=="L"?D[i][0]:D[i][3]?`<span>${wordImage(D[i])}</span><small>${D[i][2]}</small>`:D[i][1]?`<span>${D[i][1]}</span><small>${D[i][2]}</small>`:`<small class="jp">${D[i][2]}</small>`;
 w.appendChild(b);$("A").appendChild(w);
 const c={s,i,el:w,b,w:w.offsetWidth,h:w.offsetHeight,x:0,y:0,vx:0,vy:0,tx:0,ty:0,tt:0,fz:false};
 place(c);rv(c);c.vx=c.tx;c.vy=c.ty;C.push(c);paint();
 w.style.transform=`translate(${c.x}px,${c.y}px)`;return c}
/* カード同士がかさならないようにはじく(止まっているカードは動かさない) */
function sep(a,b,P,V,T,Z,o){
 const s=a[P]+a[Z]/2<b[P]+b[Z]/2?-1:1,ma=a.fz?0:1,mb=b.fz?0:1,t=ma+mb;
 if(!t)return;
 a[P]+=s*(o+1)*ma/t;b[P]-=s*(o+1)*mb/t;
 if(ma)a[V]=a[T]=s*Math.max(Math.abs(a[V]),30);
 if(mb)b[V]=b[T]=-s*Math.max(Math.abs(b[V]),30)}
function hit(a,b){
 const ox=Math.min(a.x+a.w,b.x+b.w)-Math.max(a.x,b.x),oy=Math.min(a.y+a.h,b.y+b.h)-Math.max(a.y,b.y);
 if(ox<=0||oy<=0)return;
 if(ox<oy)sep(a,b,"x","vx","tx","w",ox);else sep(a,b,"y","vy","ty","h",oy)}
function tick(t){
 if(!run)return;
 const dt=Math.min(.05,(t-lt)/1e3||0);lt=t;
 if(M=="time"){tl-=dt;$("tm").textContent=Math.max(0,Math.ceil(tl));$("tm").style.color=tl<=10?"var(--berry)":"";$("gp").style.width=Math.max(0,tl)/TL*100+"%";if(tl<=0){finish();return}}
 for(const c of C){
  if(c.fz)continue;
  c.tt-=dt;if(c.tt<=0)rv(c);
  const k=Math.min(1,dt*1.2);c.vx+=(c.tx-c.vx)*k;c.vy+=(c.ty-c.vy)*k;
  c.x+=c.vx*dt;c.y+=c.vy*dt}
 for(let a=0;a<C.length;a++)for(let b=a+1;b<C.length;b++)hit(C[a],C[b]);
 for(const c of C){
  const mx=Math.max(0,AW-c.w),my=Math.max(0,AH-c.h);
  if(c.x<0){c.x=0;c.vx=c.tx=Math.abs(c.vx)||30}else if(c.x>mx){c.x=mx;c.vx=c.tx=-(Math.abs(c.vx)||30)}
  if(c.y<0){c.y=0;c.vy=c.ty=Math.abs(c.vy)||30}else if(c.y>my){c.y=my;c.vy=c.ty=-(Math.abs(c.vy)||30)}
  c.el.style.transform=`translate(${c.x.toFixed(1)}px,${c.y.toFixed(1)}px) rotate(${c.fz?0:(c.vx/25).toFixed(1)}deg)`}
 raf=requestAnimationFrame(tick)}
/* えらんだカードは止めて、ペアをさがしやすくする */
function mark(){C.forEach(c=>{const o=!!sel&&sel.s==c.s&&sel.i==c.i;c.b.classList.toggle("on",o);c.el.classList.toggle("sel",o);c.fz=o})}

/* ---- カードのふやし方 ----
   プレーヤーがカードをタップするたびに、1まいずつふえる(ペアをけしたあとの自動ほじゅうはしない)。
   ふえるカードは「ペアが成立するカード(あいてがもう場にいる)」と「成立しないカード(あいてはまだ場にいない)」をこうごに出す。
   だから「あたらしく出たカード」をおしても、それだけではこたえにならない。 */
const opp=s=>s=="L"?"R":"L";
const has=(s,i)=>C.some(c=>c.s==s&&c.i==i);
const orph=()=>C.filter(c=>!has(opp(c.s),c.i));            /* あいてが場にいないカード */
const lives=()=>C.filter(c=>c.s=="L"&&has("R",c.i)).length;  /* いま成立しているペアの数 */
/* ex: いまタップしたカードのたんご。そのあいては出さない(出すと「さわったらあいてが出た」とバレるため) */
function addLive(ex,force){
 const o=orph().filter(c=>!ex.includes(c.i));
 if(!o.length||(!force&&C.length>=CAP))return false;
 const c=o[Math.floor(Math.random()*o.length)];spawn(opp(c.s),c.i,1);return true}
function addOrphan(){
 if(!q.length&&M=="time")refill();
 if(!q.length||C.length>=CAP||orph().length>=OMAX)return false;
 spawn(Math.random()<.5?"L":"R",q.shift(),1);return true}
function addCard(ex){
 const a=want?addLive:addOrphan,b=want?addOrphan:addLive;
 const t=a(ex)?want:b(ex)?!want:null;   /* 出せなかったら、反対のしゅるいで。そのときはじゅんばんを進めない */
 if(t!==null)want=!t}
function ensureLive(){if(!lives()&&orph().length)addLive([],true)}   /* 成立ペアが0にならないよう、ひつようなら成立カードをすぐ出す */

/* ---- ヒント：ペアのいない(あいてが場にいない)カードを くらくする。ヒントなしで あそぶと とくてん2ばい ---- */
function paint(){C.forEach(c=>c.b.classList.toggle("dim",S.hint&&!has(opp(c.s),c.i)))}
function hintUi(){const b=$("hb");b.classList.toggle("off",!S.hint);b.innerHTML=S.hint?"ヒント<br>あり":"ヒント<br>なし×2"}
function toggleHint(){
 S.hint=!S.hint;if(S.hint)hintUsed=true;   /* ヒントをつけた ペアは、あとで けしても2ばいにならない(のぞき見ぼうし) */
 save();hintUi();paint();$("msg").textContent=S.hint?"くらい カードは ペアなし！":"ヒントなし！ とくてん ×2"}

/* ---- とくてん と コンボえんしゅつ ---- */
const GROW=.5;   /* 点のふえ方のゆるやかさ。小さいほどゆるやか(1=ごすうに比例 / .5=√ / .3=もっとゆるやか)。0より大きければ上限なしで ふえつづける */
let BASE=100;/* start()で、えらんだジャンルのご数から きまる */   /* きほん点＝100×(しゅうろくご数÷30)^GROW。GROW=.5だと 30ご=100点 / 78ご=160点 / 120ご=200点 / 300ご=320点 */
const pts=c=>BASE*c*(1+Math.floor(c/3));   /* 1かいぶんの点。コンボが ふえるほど ぐんぐん ふえる(1:100 2:200 3:600 5:1000 6:1800 10:4000…) */
const tier=c=>c<3?0:c<5?1:c<7?2:c<10?3:4;   /* えんしゅつレベル。大きいほど はなやか */
const TC=["#ffd23f","#ffb13f","#ff8a3f","#ff5d73","#ff5d73"];
const SETS=[["✨","⭐"],["✨","⭐","💫"],["🌟","💫","✨","🎵"],["🌈","🌟","🎉","💥"],["🎆","🎇","🌟","💥","🎉","🌈"]];
let bnId=0;
function setScore(v){
 cancelAnimationFrame(scT);const a=scShown,t0=performance.now(),e=$("sc");
 e.classList.remove("pop");void e.offsetWidth;e.classList.add("pop");
 const f=t=>{const k=Math.min(1,(t-t0)/450);scShown=Math.round(a+(v-a)*(1-Math.pow(1-k,3)));e.textContent=scShown.toLocaleString();if(k<1)scT=requestAnimationFrame(f)};
 scT=requestAnimationFrame(f)}
function comboEnd(){const c=$("cb");c.style.fontSize="";c.style.color="";$("A").dataset.t=0}
function comboFx(A,g,mul,f){
 const T=tier(combo),ra=A[0].b.getBoundingClientRect(),rb=A[1].b.getBoundingClientRect();
 const x=(ra.left+ra.right+rb.left+rb.right)/4,y=(ra.top+ra.bottom+rb.top+rb.bottom)/4,add=(el,ms)=>{document.body.appendChild(el);setTimeout(()=>el.remove(),ms)};
 A.forEach(c=>burst(c.b,[6,10,16,22,30][T],SETS[T],[70,90,120,150,190][T],[20,22,26,30,34][T]));
 if(T){const r=document.createElement("i");r.className="ring";r.style.cssText=`left:${x}px;top:${y}px;--rs:${140+T*100}px;border-color:${TC[T]}`;add(r,650)}
 const p=document.createElement("i");p.className="pu t"+T;p.textContent="+"+g.toLocaleString()+(mul>1?" ×2":"");
 p.style.cssText=`left:${x}px;top:${y}px;font-size:${22+T*9}px;color:${TC[T]}`;add(p,1000);
 $("A").dataset.t=T;
 if(T>=3){const a=$("A");a.classList.remove("shk","shk4");void a.offsetWidth;a.classList.add(T>3?"shk4":"shk");setTimeout(()=>a.classList.remove("shk","shk4"),350)}
 const big=combo==5||combo>=10&&combo%5==0;
 if(big){const l=$("fl");l.classList.remove("go");void l.offsetWidth;l.classList.add("go")}
 if(big||combo==3||combo==7){
  const t="COMBO"+"!".repeat(T>=3?2:1),fs=Math.min(30+T*8,Math.floor(innerWidth*.88/(t.length*.75))),id=++bnId;
  $("fx").innerHTML=`<b style="font-size:${fs}px;--c:${TC[T]}"><span style="display:block;font-size:1.8em;line-height:1">${combo}</span>${t}</b>`;setTimeout(()=>{if(id==bnId)$("fx").innerHTML=""},1200)}
 if(T>=2)setTimeout(()=>sfx("sp",f/B0*2),110);
 if(T>=3)setTimeout(()=>sfx("sp",f/B0*2.5),170);
 if(big)setTimeout(()=>sfx("big",f/B0),220)}

function start(m){M=m||"stage";
 N=M=="time"?Math.min(S.n||1e9,pool().length):10;BASE=Math.round(Math.pow((M=="time"?N:pool().length)/30,GROW)*10)*10;q=sh(pool().map(i=>[i,cnt(i)+Math.random()*1.5]).sort((a,b)=>a[1]-b[1]).slice(0,N).map(a=>a[0]));
 LW=q.slice();const f=q.splice(0,P0),o=q.splice(0,O0);
 $("A").innerHTML="";C=[];sel=null;combo=done=errs=best=newM=0;miss=new Set();seen=new Set();tl=TL;lap=1;lapDone=0;busy=false;want=true;
 score=scShown=0;hintUsed=S.hint;$("sc").textContent="0";comboEnd();hintUi();
 $("msg").textContent=S.hint?"くらい カードは ペアなし！":"ペアの いない カードも！";$("cb").textContent="";$("gp").style.width=M=="time"?"100%":"0";$("tm").textContent=M=="time"?TL:"";$("tm").style.color="";
 show("game");measure();
 CAP=Math.max(P0*2+O0+1,Math.min(13,Math.floor(AW*AH*.5/9000)));   /* 画面がせまいときは、場のカードの上限をへらす */
 f.forEach(i=>{spawn("L",i,0);spawn("R",i,0)});
 o.forEach((i,k)=>spawn(k%2?"L":"R",i,0));
 run=true;lt=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(tick)}
/* とんでいるカードをたしかにつかまえるため、タップは「さわった瞬間」に判定 */
$("A").addEventListener("pointerdown",e=>{
 if(e.button>0)return;
 const b=e.target.closest(".cd");if(!b||busy)return;
 const s=b.dataset.s,i=+b.dataset.i;
 if(AC&&AC.state=="suspended")AC.resume();
 if(S.hint)hintUsed=true;
 if(s=="L")say(i);
 if(!sel||sel.s==s){
  if(sel&&sel.i==i)return;   /* えらんでいるカードをもういちどさわっても、カードはふえない */
  sfx("tap");sel={s,i};mark();addCard([i]);return}
 const li=s=="L"?i:sel.i,ri=s=="R"?i:sel.i;
 const A=[C.find(c=>c.s=="L"&&c.i==li),C.find(c=>c.s=="R"&&c.i==ri)];
 busy=true;sel=null;mark();
 if(li==ri)good(li,A);else oops(li,ri,A)});
function good(li,A){
 combo++;best=Math.max(best,combo);done++;
 if(!miss.has(li)&&!seen.has(li)){seen.add(li);const o=lv(li);S.c[li]=cnt(li)+1;if(o<2&&lv(li)==2)newM++}
 const mul=hintUsed?1:2,g=pts(combo)*mul,T=tier(combo);hintUsed=S.hint;score+=g;setScore(score);
 const f=523.25*Math.pow(2,PEN[Math.min(combo-1,PEN.length-1)]/12);sfx("ok",f/B0);
 try{navigator.vibrate(12+T*8)}catch(e){}
 A.forEach(c=>{c.fz=true;c.b.classList.add("ok")});comboFx(A,g,mul,f);
 const c=$("cb");c.textContent=`🔥 ${combo}`;c.style.fontSize=Math.min(22+combo*2,44)+"px";c.style.color=TC[T];c.classList.remove("pop");void c.offsetWidth;c.classList.add("pop");
 $("msg").textContent=MSG[Math.min(combo-1,5)];if(M=="time"){if(++lapDone>=N){lapDone=0;const b=BASE*5*lap;score+=b;setScore(score);$("msg").textContent=`🔁 ${lap}しゅう クリア！ +${b.toLocaleString()}`;lap++}}else $("gp").style.width=done/N*100+"%";
 setTimeout(()=>{
  A.forEach(x=>x.el.remove());C=C.filter(x=>!A.includes(x));
  addCard([]);ensureLive();
  if(M!="time"&&done>=N)setTimeout(finish,900);   /* さいごの演出が見えるよう、けっか画面は少しおくらせる */
  else busy=false},260)}
function oops(li,ri,A){
 combo=0;errs++;$("cb").textContent="";comboEnd();$("msg").textContent="Oops! Try again!";
 [li,ri].forEach(x=>{if(!miss.has(x)){miss.add(x);S.c[x]=Math.max(0,cnt(x)-1)}});
 sfx("ng");try{navigator.vibrate(40)}catch(e){}
 A.forEach(c=>c.b.classList.add("bad"));addCard([li,ri]);
 setTimeout(()=>{A.forEach(c=>c.b.classList.remove("bad"));busy=false},350)}
function finish(){
 run=false;cancelAnimationFrame(raf);
 const st=M=="time"?(done>=N*3?3:done>=N*2?2:1):errs==0?3:errs<=2?2:1,t=new Date().toDateString();
 if(S.last!=t){S.streak=S.last==new Date(Date.now()-864e5).toDateString()?S.streak+1:1;S.last=t}
 S.best=Math.max(S.best,best);const hk=M=="time"?"hiT":"hi",rec=S[hk]>0&&score>S[hk];S[hk]=Math.max(S[hk]||0,score);save();comboEnd();bnId++;$("fx").innerHTML="";
 $("rs").innerHTML=[0,1,2].map(k=>`<b class="${k<st?"on":""}" style="--k:${k}">★</b>`).join("");
 $("rt").innerHTML=`<div style="font-size:40px;font-weight:900;color:var(--sun)">⭐ ${score.toLocaleString()}</div>${rec?"🏆 ベストこうしん！<br>":""}${M=="time"?`🔁 ${done}ペア（${lap-1}しゅう）<br>`:""}ミス ${errs}かい ／ さいこうコンボ ${best}<br>${newM?`🏅 マスターが ${newM}ご ふえた！<br>`:""}🔥 ${S.streak}日れんぞく`;
 sfx("fin");show("res");
 if(st==3)for(let k=0;k<4;k++)setTimeout(()=>burst($("rs"),10),k*150)}
home();
</script></body></html>
