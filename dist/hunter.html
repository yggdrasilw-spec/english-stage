   bell: ベルのような音(基本音+倍音)。f=周波数 d=長さ(秒) v=音量 t=ずらし(秒) */
function bell(f,d,v,t=0){const c=ac();if(!c)return;
 try{const n=c.currentTime+t,g=c.createGain();g.connect(c.destination);
  g.gain.setValueAtTime(.0001,n);g.gain.linearRampToValueAtTime(v,n+.003);g.gain.exponentialRampToValueAtTime(.0005,n+d);
  [[1,1],[2,.35],[3.01,.15]].forEach(([m,a])=>{const o=c.createOscillator(),h=c.createGain();o.frequency.value=f*m;h.gain.value=a;o.connect(h);h.connect(g);o.start(n);o.stop(n+d+.02)})}catch(e){}}
/* ミスのおと：低くさがるブー */
function wob(){const c=ac();if(!c)return;
 try{const n=c.currentTime,o=c.createOscillator(),g=c.createGain();o.type="triangle";o.frequency.setValueAtTime(220,n);o.frequency.exponentialRampToValueAtTime(130,n+.3);
  g.gain.setValueAtTime(.2,n);g.gain.exponentialRampToValueAtTime(.001,n+.3);o.connect(g);g.connect(c.destination);o.start(n);o.stop(n+.3)}catch(e){}}
/* sfx(名前, ピッチ倍率=コンボで上がる)  tap:カードえらび ok:せいかい sp:キラキラ big:大コンボ ng:ミス fin:クリア */
function sfx(n,r=1){const f=B0*Math.min(r,6);
 if(n=="tap")bell(880,.07,.1);
 else if(n=="ok"){bell(f,.4,.15);bell(f*1.5,.4,.13,.07)}
 else if(n=="sp")bell(f,.25,.1);
 else if(n=="big")[1,1.25,1.5,2,2.5].forEach((m,k)=>bell(f*m,.3,.1,k*.07));
 else if(n=="fin")[523.25,659.26,783.99,1046.5].forEach((q,k)=>bell(q,.35,.14,k*.11));
 else if(n=="ng")wob()}
