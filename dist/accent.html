<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
:root{--lit:#E3E3FF;--bg:#F1EEFF;--glow:#fff;--card:#fff;--ink:#241F5C;--mute:#7470A3;--line:#DAD5F6;--pri:#5B5CFF;--pri-d:#3738C4;--hot:#FF9A1F;--hot-d:#D4690A;--okc:#1FAF74;--okd:#128A58;--okbg:#DDF6EA;--ngc:#E5546B;--ngd:#B93450;--ngbg:#FFE5EA;--weak:#C4C0EE;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--lit:#3B3897;--bg:#14123A;--glow:#2B2788;--card:#242059;--ink:#F2F0FF;--mute:#A9A5DA;--line:#39347D;--okbg:#10382B;--ngbg:#43202C;--weak:#4B4792}}
:root[data-theme="dark"]{--lit:#3B3897;--bg:#14123A;--glow:#2B2788;--card:#242059;--ink:#F2F0FF;--mute:#A9A5DA;--line:#39347D;--okbg:#10382B;--ngbg:#43202C;--weak:#4B4792}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:radial-gradient(90% 55% at 50% 0,var(--glow),transparent),var(--bg);color:var(--ink);font:700 16px/1.45 "Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic UI",Meiryo,system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;cursor:pointer;padding:0}
button:focus-visible{outline:4px solid var(--hot);outline-offset:3px}
#app{height:100%;max-width:560px;margin:0 auto;position:relative}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;opacity:0;pointer-events:none;transform:translateY(16px);transition:opacity .35s,transform .35s}
.scr.on{opacity:1;pointer-events:auto;transform:none}

.ghost{background:none;color:var(--mute);font-size:16px;padding:10px 20px}
.note{margin:0;font-size:13px;color:var(--mute)}
/* start */
#start{justify-content:center;gap:clamp(16px,3.6vh,32px);padding:24px;text-align:center}
.demo{display:flex;gap:12px;align-items:center;height:clamp(110px,18vh,150px)}

.blob.hot{background:linear-gradient(#FFB63D,var(--hot));color:#fff;padding:26px 30px;font-size:44px;box-shadow:0 8px 0 var(--hot-d),0 0 40px #FF9A1F77;animation-name:beatH;animation-delay:.55s}
.blob:nth-child(3){animation-delay:1.1s}
h1{margin:0;font-size:clamp(30px,8.4vw,46px);line-height:1.25;font-weight:900}
.sub{margin:0;color:var(--mute)}
.chips{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.chip{background:var(--card);border-radius:99px;padding:9px 16px;font-size:14px;box-shadow:inset 0 0 0 2px var(--line)}
.chip[aria-pressed=true]{box-shadow:inset 0 0 0 2px var(--pri);color:var(--pri)}

.hd{display:flex;align-items:center;gap:12px;padding:0 16px;width:100%}
.x{width:40px;height:40px;border-radius:50%;background:var(--card);color:var(--mute);font-size:18px;box-shadow:0 3px 0 var(--line)}
.x:active,.slow:active{transform:translateY(3px)}
.bar{flex:1;display:flex;gap:5px}
.bar i{flex:1;height:12px;border-radius:9px;background:var(--line);transition:background .3s}
.bar i.cur{background:var(--pri);animation:blink 1.4s infinite}
.bar i.ok{background:var(--okc)}.bar i.ng{background:var(--ngc)}
.fire{font:900 16px Nunito,sans-serif;background:var(--card);border-radius:99px;padding:7px 12px;min-width:66px;text-align:center;box-shadow:0 3px 0 var(--line)}
.stage{flex:1;min-height:0;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;padding:6px 16px}
.wd{display:flex;flex-direction:column;align-items:center;gap:8px}
.pic{width:clamp(92px,16vh,128px);aspect-ratio:1;border-radius:34px;background:var(--card);display:grid;place-items:center;font-size:clamp(50px,9.5vh,72px);box-shadow:0 6px 0 var(--line);animation:pop .5s both}
.jp{height:22px;margin:0;font-size:17px;color:var(--mute);opacity:0;transition:opacity .3s}.jp.on{opacity:1}
.sp{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;width:100%}
.spk{position:relative;grid-column:2;width:clamp(88px,15vh,112px);aspect-ratio:1;border-radius:50%;background:var(--pri);box-shadow:0 7px 0 var(--pri-d);display:grid;place-items:center;transition:transform .08s,box-shadow .08s}
.spk:active{transform:translateY(5px);box-shadow:0 2px 0 var(--pri-d)}
.spk svg{width:46%;fill:#fff}
.spk::before,.spk::after{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid var(--pri);opacity:0;pointer-events:none}
.spk.on::before{animation:ring 1s infinite}.spk.on::after{animation:ring 1s .45s infinite}
.slow{grid-column:3;justify-self:start;margin-left:16px;width:52px;height:52px;border-radius:50%;background:var(--card);font-size:24px;box-shadow:0 4px 0 var(--line)}
.q{margin:0;font-size:clamp(18px,5.2vw,23px);font-weight:900;text-align:center}

.foot.ok h3{color:var(--okc)}.foot.ng h3{color:var(--ngc)}

.it{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);border-radius:20px;padding:10px 14px;box-shadow:0 4px 0 var(--line);text-align:left}

/* しつもんの声モード */
.modes .chip{font-size:16px;padding:11px 18px}.modes .chip[aria-pressed=true]{background:var(--pri);color:#fff;box-shadow:0 4px 0 var(--pri-d)}
.sent{display:none;margin:0;font:900 clamp(20px,6vw,26px)/1.35 Nunito,sans-serif;text-align:center}
.sent i{font-style:normal;display:inline-block;transition:transform .15s,color .15s}.sent i.on{color:var(--pri);transform:translateY(-4px) scale(1.15)}

.mq .sent{display:block}.mq .pic{display:none}.mq .jp{font-size:15px}.mq .foot p{font-size:13px}.mq .spk{width:clamp(72px,12vh,96px)}
.ch{flex:1 1 0;max-width:170px;display:flex;flex-direction:column;gap:12px}
.ch .syl{flex:none;max-width:none;width:100%;height:clamp(64px,11vh,96px);font-size:clamp(24px,7vw,32px)}
.pl.on{background:var(--lit);box-shadow:0 6px 0 var(--pri-d),inset 0 0 0 3px var(--pri)}
.pk{--c:var(--hot);--cd:var(--hot-d);width:100%;font-size:16px;padding:11px 0;border-radius:16px}
.mq .syl.big::after{content:'ふつうはこっち！'}
.it b.s{font-size:16px}.it b small{display:block;font:700 12px "Zen Maru Gothic",sans-serif;color:var(--mute)}.it i.a{font:900 20px Nunito,sans-serif;color:var(--hot-d)}

    return [it.id+'_'+v,URL.createObjectURL(blob)]
   }finally{clearTimeout(deadline)}
  })).then(results=>{const pair=results.filter(x=>x.status==='fulfilled').map(x=>x.value);
   if(generation!==questionGeneration||pair.length!==2){pair.forEach(([,url])=>URL.revokeObjectURL(url));if(generation===questionGeneration)questionFailures.add(it.id);return}
   pair.forEach(([key,url])=>questionBlobs.set(key,url));
  }).finally(()=>{if(questionLoads.get(it.id)===loading)questionLoads.delete(it.id)});
  questionLoads.set(it.id,loading);
 }
}
function voice(it,v,r,cb,c){
 // A slow first download must not permanently select the humming mock.
 // Wait for both halves; stopSync can cancel this pending playback too.
 if(!questionModes.has(it.id)&&hasQuestionPair(it)&&questionLoads.has(it.id)){
  let cancelled=false;vo={stop(){cancelled=true}};
  questionLoads.get(it.id).then(()=>{if(!cancelled)voice(it,v,r,cb,c)});return;
 }
 if(!questionModes.has(it.id))questionModes.set(it.id,!!(hasQuestionPair(it)&&questionBlobs.has(it.id+'_u')&&questionBlobs.has(it.id+'_d')));
 if(!questionModes.get(it.id)||!hasQuestionPair(it))return voiceMock(it,v,r,cb,c);
 const clip=CLIPS[it.id+'_'+v],audio=questionAudio,el=$$('.sent i'),pl=c==null?null:$$('.pl')[c];
 let stopped=false,done=false,started=false;const local=[];
 const clear=()=>{local.forEach(clearTimeout);local.length=0;pl&&pl.classList.remove('on');el.forEach(e=>e.classList.remove('on'));audio.onended=null;audio.onerror=null;audio.onplaying=null};
 const stop=()=>{stopped=true;clear();audio.pause();try{audio.currentTime=0}catch(e){}};
 const finish=()=>{if(stopped||done)return;done=true;clear();audio.pause();cb&&cb()};
 const schedule=(f,ms)=>{const t=setTimeout(f,ms);local.push(t);tms.push(t)};
 const fallback=()=>{if(stopped||done)return;questionFailures.add(it.id);stop();voiceMock(it,v,r,cb,c)};
 audio.pause();audio.src=questionBlobs.get(it.id+'_'+v);audio.playbackRate=r;audio.preservesPitch=true;audio.webkitPreservesPitch=true;
 audio.onended=finish;audio.onerror=fallback;
 audio.onplaying=()=>{if(stopped||started)return;started=true;pl&&pl.classList.add('on');
  if(sync||answered)clip.T.forEach((t,j)=>{schedule(()=>el[j]&&el[j].classList.add('on'),t/r);schedule(()=>el[j]&&el[j].classList.remove('on'),((clip.T[j+1]||clip.dur)-20)/r)});
  schedule(finish,clip.dur/r+500);
 };
 vo={stop};
 const p=audio.play();if(p)p.catch(fallback);
 // Catch stalled loading separately; stopSync cancels this along with all highlights.
 schedule(()=>{if(!started)fallback()},5000);
}

function playQ(v,r,cb){stopSync();voice(Q[i],Q[i].v[v],r||1,cb,v)}
function playAB(r){r=r||1;stopSync();const sp=$('#spk');sp.classList.add('on');voice(Q[i],Q[i].v[0],r,()=>tms.push(setTimeout(()=>voice(Q[i],Q[i].v[1],r,()=>sp.classList.remove('on'),1),350)),0)}
function footQ(s,w){const f=$('#foot'),t=w&&(w.p==6?(w.n=='d'?TD:TU):PT[w.p]);f.className='foot '+s;
 $('#fh').textContent=s=='idle'?'💡 ききかたのコツ':s=='ok'?P[i%P.length]:'おしい！';
 $('#fp').innerHTML=s=='idle'?'声の「さいご」が、上がるか 下がるかを 聞いてみよう':t.a+'<br>'+t.b;
 $('#next').textContent=i==L.length-1?'けっかを見る':'つぎへ'}
function qq(n){stopSync();i=n;const w=Q[n];answered=false;locked=true;setTimeout(()=>locked=false,350);
 $('#sent').innerHTML='<em>'+w.e+'</em>'+w.s.split(' ').map(x=>'<i>'+(spell?x:'・・・')+'</i>').join(' ');
 const jp=$('#jp');jp.textContent=w.jp;jp.classList.add('on');
 $('#row').innerHTML=[0,1].map(c=>`<div class="ch"><button class="syl pl" data-v="${c}">▶ ${'AB'[c]}</button><button class="cta pk" data-v="${c}">こっち！</button></div>`).join('');
 $('#bar').innerHTML=L.map((_,j)=>`<i class="${j<n?(res[j]?'ok':'ng'):j==n?'cur':''}"></i>`).join('');
 footQ('idle');go('play');setTimeout(()=>{if(i==n&&!answered&&$('#play').classList.contains('on'))playAB()},550)}
function pickQ(j){if(locked||answered)return;stopSync();answered=true;const w=Q[i],ok=j==w.k;window.recordWordEvidence({en:w.s,ja:w.jp,skill:'intonation',quality:ok?'correct':'wrong',source:'accent'});res[i]=ok;streak=ok?streak+1:0;best=Math.max(best,streak);
 $$('.ch').forEach((c,n)=>{const b=c.firstChild;b.textContent='AB'[n]+' '+(w.v[n]=='u'?'↗':'↘');b.classList.add(n==w.k?'big':'small');if(n==j&&!ok)b.classList.add('bad');c.lastChild.style.visibility='hidden'});
 $$('.sent i').forEach((e,n)=>e.textContent=w.s.split(' ')[n]);$('#bar').children[i].className=ok?'ok':'ng';
 const f=$('#fire');f.textContent='🔥 '+streak;redo(f,ok?'bump .4s':'');
 if(ok){sfx.ok();buzz(20);setTimeout(confetti,150)}else{sfx.ng();buzz([40,30,40])}
 footQ(ok?'ok':'ng',w);tms.push(setTimeout(()=>playQ(w.k),750))}
function modeUi(){$('#m0').textContent='🍌 ことばの強い音';$('#m1').textContent='❓ しつもんの声';$('#m0').setAttribute('aria-pressed',!mq);$('#m1').setAttribute('aria-pressed',!!mq);
 $('#demo').innerHTML=mq?'<span class="blob">↘</span><span class="blob hot">↗</span><span class="blob">↘</span>':'<span class="blob">ba</span><span class="blob hot">na</span><span class="blob">na</span>';
 $('#sub').innerHTML=mq?'おなじ しつもんでも、声の さいごが<br>上がったり 下がったり。耳をすまそう。':'英語には、強く言うところがあるよ。<br>耳をすまして、見つけよう。';
 $('#nt').textContent=mq?'8もん。いろんな しつもんが 出るよ。何度でも聞けるよ。':'6もん。時間ははかりません。何度でも聞けるよ。'}
$('#m0').onclick=()=>{mq=0;modeUi();sfx.tap()};$('#m1').onclick=()=>{mq=1;modeUi();sfx.tap()};
const chips=()=>{const a=$('#cSp'),b=$('#cSf'),c=$('#cSy');a.textContent=spell?'📖 つづりあり':'👂 耳だけ';a.setAttribute('aria-pressed',spell);b.textContent=sfxOn?'🔊 こうかおんあり':'🔇 こうかおんなし';b.setAttribute('aria-pressed',sfxOn);c.textContent=sync?'✨ 音に合わせて光る':'✨ 光らない';c.setAttribute('aria-pressed',sync)};
const begin=()=>{if(mq)unlockQuestionAudio();sfx.tap();streak=best=0;res=[];$('#fire').textContent='🔥 0';try{if(AC){ctx=ctx||new AC();ctx.resume()}}catch(e){}$('#play').classList.toggle('mq',!!mq);$('#qt').textContent=mq?'ふつうの言い方は、どっち？':'いちばん強く聞こえるのは、どこ？';L=mq?(Q=round()):W;if(mq)preloadRound(Q);mq?qq(0):q(0)};
$('#cSp').onclick=()=>{spell=!spell;chips();sfx.tap()};
$('#cSf').onclick=()=>{sfxOn=!sfxOn;chips();sfx.tap()};
$('#cSy').onclick=()=>{sync=!sync;chips();sfx.tap()};
$('#go').onclick=begin;$('#again').onclick=begin;
$('#home').onclick=()=>{sfx.tap();go('start')};
$('#x').onclick=()=>{stopSync();try{speechSynthesis.cancel()}catch(e){}go('start')};
$('#spk').onclick=()=>mq?playAB():play();$('#slow').onclick=()=>mq?playAB(.55):play(.55);
$('#row').onclick=e=>{if(mq){const b=e.target.closest('button');if(!b)return;sfx.tap();b.classList.contains('pk')?pickQ(+b.dataset.v):playQ(+b.dataset.v);return}const b=e.target.closest('.syl');if(b){sfx.tap();pick(+b.dataset.j)}};
$('#next').onclick=()=>{sfx.tap();i==L.length-1?fin():mq?qq(i+1):q(i+1)};
$('#list').onclick=e=>{const b=e.target.closest('.it');if(!b)return;if(mq){i=+b.dataset.k;playQ(Q[i].k)}else say(W[+b.dataset.k].w)};
addEventListener('keydown',e=>{if(!$('#play').classList.contains('on'))return;if(mq){if(e.key=='1'||e.key=='2')pickQ(e.key-1);else if(e.key=='r'||e.key=='R')playAB();return}
 if(e.key>='1'&&e.key<='4'&&W[i].s[e.key-1]!==undefined)pick(e.key-1);else if(e.key=='r'||e.key=='R')play()});
// Observe submitted word answers without changing the original accent player.
document.addEventListener('click',event=>{const button=event.target.closest('[data-j]');if(!button||mq||locked||answered)return;const word=W[i];window.recordWordEvidence({en:word.w,ja:word.jp,skill:'accent',quality:Number(button.dataset.j)===word.k?'correct':'wrong',source:'accent'});},true);
chips();modeUi();
</script>
